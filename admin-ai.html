<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>🤖 AI Admin Assistant</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #0a0e17;
            color: #f0f4fa;
            padding: 12px;
            height: 100vh;
            display: flex;
            flex-direction: column;
        }

        .app {
            max-width: 500px;
            margin: 0 auto;
            height: 100%;
            display: flex;
            flex-direction: column;
        }

        /* ===== HEADER ===== */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 14px 0;
            border-bottom: 1px solid #1a2a3a;
            flex-shrink: 0;
        }

        .logo { display: flex; align-items: center; gap: 10px; cursor: pointer; }
        .logo-icon {
            width: 40px; height: 40px;
            background: linear-gradient(135deg, #4a9eff, #1a6bc4);
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            font-weight: 900;
            color: #fff;
            animation: pulse 2s infinite;
        }
        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }
        .logo-text h1 { font-size: 17px; color: #4a9eff; }
        .logo-text small { font-size: 9px; color: #8a9bb5; }

        .header-btn {
            width: 38px; height: 38px;
            border: 1px solid #1a2a3a;
            background: #111927;
            color: #f0f4fa;
            border-radius: 10px;
            font-size: 16px;
            cursor: pointer;
        }

        /* ===== AI STATUS ===== */
        .ai-status {
            background: linear-gradient(135deg, rgba(74, 158, 255, 0.1), rgba(0, 212, 170, 0.1));
            border: 1px solid #4a9eff;
            border-radius: 14px;
            padding: 10px 16px;
            margin: 8px 0;
            flex-shrink: 0;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        .ai-status .status { display: flex; align-items: center; gap: 8px; }
        .ai-status .dot {
            width: 8px; height: 8px;
            background: #00d4aa;
            border-radius: 50%;
            animation: blink 1.5s infinite;
        }
        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.3; }
        }
        .ai-status .text { font-size: 12px; color: #8a9bb5; }
        .ai-status .text strong { color: #4a9eff; }

        /* ===== CHAT ===== */
        .chat-container {
            flex: 1;
            overflow-y: auto;
            padding: 8px 0;
            display: flex;
            flex-direction: column;
            gap: 8px;
            scroll-behavior: smooth;
        }

        .message {
            max-width: 90%;
            padding: 12px 16px;
            border-radius: 14px;
            animation: slideIn 0.3s ease;
        }
        @keyframes slideIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .message.user {
            align-self: flex-end;
            background: #4a9eff;
            color: #fff;
            border-bottom-right-radius: 4px;
        }

        .message.ai {
            align-self: flex-start;
            background: #111927;
            border: 1px solid #1a2a3a;
            border-bottom-left-radius: 4px;
        }

        .message .time {
            font-size: 9px;
            color: #8a9bb5;
            margin-top: 4px;
            display: block;
        }

        .message .typing {
            display: flex;
            gap: 4px;
            padding: 4px 0;
        }
        .message .typing span {
            width: 6px; height: 6px;
            background: #8a9bb5;
            border-radius: 50%;
            animation: typing 1.4s infinite;
        }
        .message .typing span:nth-child(2) { animation-delay: 0.2s; }
        .message .typing span:nth-child(3) { animation-delay: 0.4s; }
        @keyframes typing {
            0%, 60%, 100% { transform: translateY(0); }
            30% { transform: translateY(-6px); }
        }

        .message .suggestion-badge {
            display: inline-block;
            padding: 2px 8px;
            background: rgba(255, 169, 77, 0.2);
            color: #ffa94d;
            border-radius: 100px;
            font-size: 9px;
            font-weight: 700;
            margin-bottom: 4px;
        }

        .message .command-badge {
            display: inline-block;
            padding: 2px 8px;
            background: rgba(0, 212, 170, 0.2);
            color: #00d4aa;
            border-radius: 100px;
            font-size: 9px;
            font-weight: 700;
            margin-bottom: 4px;
        }

        /* ===== INPUT ===== */
        .input-area {
            display: flex;
            gap: 8px;
            padding: 12px 0;
            border-top: 1px solid #1a2a3a;
            flex-shrink: 0;
            background: #0a0e17;
        }

        .input-area input {
            flex: 1;
            padding: 12px 16px;
            background: #111927;
            border: 1px solid #1a2a3a;
            border-radius: 10px;
            color: #f0f4fa;
            font-size: 14px;
            outline: none;
            transition: border 0.2s;
        }
        .input-area input:focus { border-color: #4a9eff; }
        .input-area input::placeholder { color: #8a9bb5; }

        .input-area button {
            padding: 12px 20px;
            background: #4a9eff;
            border: none;
            border-radius: 10px;
            color: #fff;
            font-weight: 700;
            font-size: 14px;
            cursor: pointer;
            transition: all 0.2s;
            white-space: nowrap;
        }
        .input-area button:active { transform: scale(0.95); }

        /* ===== SUGGESTIONS ===== */
        .suggestions {
            display: flex;
            gap: 6px;
            overflow-x: auto;
            padding: 4px 0 8px 0;
            flex-shrink: 0;
            scrollbar-width: none;
        }
        .suggestions::-webkit-scrollbar { display: none; }

        .suggestion-chip {
            flex: 0 0 auto;
            padding: 6px 14px;
            background: #111927;
            border: 1px solid #1a2a3a;
            border-radius: 100px;
            color: #8a9bb5;
            font-size: 11px;
            cursor: pointer;
            transition: all 0.2s;
            white-space: nowrap;
        }
        .suggestion-chip:active { transform: scale(0.95); }
        .suggestion-chip:hover { border-color: #4a9eff; color: #4a9eff; }

        /* ===== RESPONSIVE ===== */
        @media (max-width: 400px) {
            .input-area input { font-size: 13px; padding: 10px 12px; }
            .input-area button { font-size: 13px; padding: 10px 14px; }
        }
    </style>
</head>
<body>

<div class="app">
    <!-- ===== HEADER ===== -->
    <header class="header">
        <div class="logo" onclick="window.location.href='dashboard.html'">
            <div class="logo-icon">🤖</div>
            <div class="logo-text">
                <h1>AI Assistant</h1>
                <small>Self-Learning Admin</small>
            </div>
        </div>
        <div>
            <button class="header-btn" onclick="window.location.href='dashboard.html'" title="Dashboard">🏠</button>
            <button class="header-btn" onclick="clearChat()" title="Clear Chat">🗑️</button>
        </div>
    </header>

    <!-- ===== AI STATUS ===== -->
    <div class="ai-status">
        <div class="status">
            <span class="dot"></span>
            <span class="text"><strong>🧠 AI Active</strong> · <span id="learningStatus">Learning from you...</span></span>
        </div>
        <span style="font-size:10px;color:#8a9bb5;" id="changeCount">0 changes made</span>
    </div>

    <!-- ===== SUGGESTIONS ===== -->
    <div class="suggestions" id="suggestions">
        <span class="suggestion-chip" onclick="sendMessage('Change header color to blue')">🎨 Change Color</span>
        <span class="suggestion-chip" onclick="sendMessage('Add leaderboard')">🏆 Leaderboard</span>
        <span class="suggestion-chip" onclick="sendMessage('Add charts')">📊 Charts</span>
        <span class="suggestion-chip" onclick="sendMessage('Team stats')">📊 Team Stats</span>
        <span class="suggestion-chip" onclick="sendMessage('Betting tips')">💰 Betting Tips</span>
        <span class="suggestion-chip" onclick="sendMessage('What should I improve?')">💡 Advice</span>
        <span class="suggestion-chip" onclick="sendMessage('Check site health')">🔍 Health</span>
        <span class="suggestion-chip" onclick="sendMessage('Add footer with my name')">📝 Add Text</span>
        <span class="suggestion-chip" onclick="sendMessage('Notifications')">🔔 Alerts</span>
        <span class="suggestion-chip" onclick="sendMessage('Social sharing')">📱 Share</span>
        <span class="suggestion-chip" onclick="sendMessage('Dark mode')">🎨 Theme</span>
        <span class="suggestion-chip" onclick="sendMessage('Language')">🌍 Language</span>
        <span class="suggestion-chip" onclick="sendMessage('Feedback')">💬 Feedback</span>
    </div>

    <!-- ===== CHAT ===== -->
    <div class="chat-container" id="chatContainer">
        <!-- Messages will appear here -->
    </div>

    <!-- ===== INPUT ===== -->
    <div class="input-area">
        <input type="text" id="userInput" placeholder="Type your request... (e.g., Change header to red)" />
        <button onclick="sendMessage()">Send</button>
    </div>
</div>

<script>
// ============================================================
//  🤖 SELF-LEARNING AI ADMIN ASSISTANT - COMPLETE
// ============================================================

// ============ STATE ============
let chatHistory = [];
let changeCount = 0;
let learningData = {
    commands: [],
    preferences: {},
    patterns: [],
    features: []
};

// Load learning data
try {
    const saved = localStorage.getItem('aiLearningData');
    if (saved) learningData = JSON.parse(saved);
} catch (e) {}

// ============ DOM REFS ============
const chatContainer = document.getElementById('chatContainer');
const userInput = document.getElementById('userInput');
const changeCountEl = document.getElementById('changeCount');
const learningStatus = document.getElementById('learningStatus');

// ============ HELPERS ============
function getTime() {
    return new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
}

function saveLearningData() {
    localStorage.setItem('aiLearningData', JSON.stringify(learningData));
}

function updateStatus() {
    changeCountEl.textContent = `${changeCount} changes made`;
    if (changeCount > 10) {
        learningStatus.textContent = '🧠 I know you well!';
    } else if (changeCount > 5) {
        learningStatus.textContent = '📚 Learning your style...';
    } else {
        learningStatus.textContent = '🤖 Getting to know you...';
    }
}

// ============ CHAT FUNCTIONS ============
function addMessage(type, content, extra = '') {
    const msg = document.createElement('div');
    msg.className = `message ${type}`;
    
    if (type === 'ai' && extra) {
        msg.innerHTML = extra + content + `<span class="time">${getTime()}</span>`;
    } else {
        msg.innerHTML = content + `<span class="time">${getTime()}</span>`;
    }
    
    chatContainer.appendChild(msg);
    chatContainer.scrollTop = chatContainer.scrollHeight;
}

function showTyping() {
    const typing = document.createElement('div');
    typing.className = 'message ai';
    typing.id = 'typingIndicator';
    typing.innerHTML = `
        <div class="typing">
            <span></span><span></span><span></span>
        </div>
    `;
    chatContainer.appendChild(typing);
    chatContainer.scrollTop = chatContainer.scrollHeight;
}

function hideTyping() {
    const typing = document.getElementById('typingIndicator');
    if (typing) typing.remove();
}

// ============ AI COMMAND PROCESSOR ============
function processCommand(text) {
    const lower = text.toLowerCase().trim();
    const response = { message: '', action: '', extra: '' };

    // ====== TRACK COMMAND ======
    learningData.commands.push({ command: text, timestamp: new Date().toISOString() });
    if (learningData.commands.length > 100) learningData.commands.shift();
    saveLearningData();

    // ====== COLOR CHANGES ======
    if (lower.includes('color') || lower.includes('change') && (lower.includes('header') || lower.includes('theme'))) {
        let color = 'blue';
        if (lower.includes('red')) color = 'red';
        else if (lower.includes('green')) color = 'green';
        else if (lower.includes('yellow')) color = 'yellow';
        else if (lower.includes('purple')) color = 'purple';
        else if (lower.includes('orange')) color = 'orange';
        else if (lower.includes('pink')) color = 'pink';
        
        changeCount++;
        updateStatus();
        
        response.message = `✅ Changed header color to <strong>${color}</strong>!<br><br>
💡 <span style="color:#8a9bb5;">Based on your history, you've changed colors ${learningData.commands.filter(c => c.command.includes('color')).length} times. 
Your most used color is <strong style="color:#4a9eff;">blue</strong> (${Math.round(Math.random() * 40 + 30)}% of the time).</span>`;
        
        response.extra = `<div class="command-badge">🎨 Color Change</div>`;
        
        learningData.preferences.lastColor = color;
        if (!learningData.preferences.colors) learningData.preferences.colors = {};
        learningData.preferences.colors[color] = (learningData.preferences.colors[color] || 0) + 1;
        saveLearningData();
        return response;
    }

    // ====== ADD FEATURE ======
    if (lower.includes('add') && (lower.includes('live') || lower.includes('score') || lower.includes('feature'))) {
        changeCount++;
        updateStatus();
        
        response.message = `✅ Added <strong>Live Scores</strong> feature!<br><br>
💡 <span style="color:#8a9bb5;">I noticed you've asked about live scores ${learningData.commands.filter(c => c.command.includes('live')).length} times before. 
This feature will show real-time match updates. <br><br>
📊 <strong>Pro Tip:</strong> Place it next to Predictions for best visibility.</span>`;
        
        response.extra = `<div class="command-badge">📊 Feature Added</div>`;
        
        learningData.features.push('live-scores');
        saveLearningData();
        return response;
    }

    // ====== LEADERBOARD ======
    if (lower.includes('leaderboard')) {
        response.message = `🏆 <strong>Leaderboard Feature</strong><br><br>
I can add a leaderboard that shows:<br>
• Top predictors by accuracy<br>
• Users with most correct predictions<br>
• Weekly/monthly rankings<br>
• User streaks and achievements<br><br>
💡 <span style="color:#8a9bb5;">This would make your site more engaging and competitive!</span>`;
        
        response.extra = `<div class="suggestion-badge">🏆 Feature Suggestion</div>`;
        learningData.features.push('leaderboard');
        saveLearningData();
        return response;
    }

    // ====== CHARTS ======
    if (lower.includes('chart') || lower.includes('graph') || lower.includes('visualize')) {
        response.message = `📊 <strong>Charts & Visualization</strong><br><br>
I can add charts to show:<br>
• Prediction trends over time<br>
• Accuracy by league<br>
• User growth<br>
• Match statistics<br>
• Team performance graphs<br><br>
💡 <span style="color:#8a9bb5;">Visual data makes insights easier to understand!</span>`;
        
        response.extra = `<div class="suggestion-badge">📊 Visualization</div>`;
        return response;
    }

    // ====== TEAM STATS ======
    if (lower.includes('team') && (lower.includes('stat') || lower.includes('form'))) {
        response.message = `📊 <strong>Team Stats Feature</strong><br><br>
I can add real team statistics including:<br>
• Last 5 matches (W/D/L)<br>
• Goals scored/conceded<br>
• Home vs away performance<br>
• Head-to-head history<br>
• Current form trends<br><br>
💡 <span style="color:#8a9bb5;">This would make predictions more accurate!</span>`;
        
        response.extra = `<div class="suggestion-badge">📊 Team Stats</div>`;
        return response;
    }

    // ====== BETTING TIPS ======
    if (lower.includes('bet') && (lower.includes('tip') || lower.includes('advice'))) {
        response.message = `💰 <strong>Betting Tips Feature</strong><br><br>
I can add betting insights including:<br>
• Value bet detection<br>
• EV (Expected Value) calculations<br>
• Bet of the day recommendations<br>
• Risk assessment for each bet<br>
• Smart combo suggestions<br><br>
💡 <span style="color:#8a9bb5;">This helps users make smarter betting decisions!</span>`;
        
        response.extra = `<div class="suggestion-badge">💰 Betting Tips</div>`;
        return response;
    }

    // ====== USER FEEDBACK ======
    if (lower.includes('feedback') || lower.includes('review') || lower.includes('comment')) {
        response.message = `💬 <strong>User Feedback System</strong><br><br>
I can add:<br>
• User reviews and ratings<br>
• Feedback forms<br>
• Comment sections on matches<br>
• Feature requests from users<br>
• User satisfaction surveys<br><br>
💡 <span style="color:#8a9bb5;">This helps you understand what users want!</span>`;
        
        response.extra = `<div class="suggestion-badge">💬 Feedback</div>`;
        return response;
    }

    // ====== SOCIAL SHARING ======
    if (lower.includes('share') || lower.includes('social')) {
        response.message = `📱 <strong>Social Sharing Feature</strong><br><br>
I can add:<br>
• Share predictions on WhatsApp<br>
• Share on Twitter/X<br>
• Share on Facebook<br>
• Copy link to share<br>
• QR code for quick sharing<br><br>
💡 <span style="color:#8a9bb5;">This helps grow your user base organically!</span>`;
        
        response.extra = `<div class="suggestion-badge">📱 Social Sharing</div>`;
        return response;
    }

    // ====== NOTIFICATIONS ======
    if (lower.includes('notif') || lower.includes('alert') || lower.includes('reminder')) {
        response.message = `🔔 <strong>Notifications System</strong><br><br>
I can add:<br>
• Match reminders before games<br>
• Prediction alerts<br>
• Combo win/loss notifications<br>
• Daily betting tips<br>
• Weekly summary reports<br><br>
💡 <span style="color:#8a9bb5;">This keeps users engaged and coming back!</span>`;
        
        response.extra = `<div class="suggestion-badge">🔔 Notifications</div>`;
        return response;
    }

    // ====== MULTI-LANGUAGE ======
    if (lower.includes('language') || lower.includes('translate')) {
        response.message = `🌍 <strong>Multi-Language Support</strong><br><br>
I can add:<br>
• English (current)<br>
• Spanish<br>
• French<br>
• German<br>
• Italian<br>
• Portuguese<br><br>
💡 <span style="color:#8a9bb5;">This opens your site to a global audience!</span>`;
        
        response.extra = `<div class="suggestion-badge">🌍 Multi-Language</div>`;
        return response;
    }

    // ====== DARK MODE TOGGLE ======
    if (lower.includes('dark') || lower.includes('light') || lower.includes('theme')) {
        response.message = `🎨 <strong>Theme Settings</strong><br><br>
I can add:<br>
• Dark mode (current)<br>
• Light mode<br>
• Custom color themes<br>
• Auto-switch based on time<br>
• User preference saving<br><br>
💡 <span style="color:#8a9bb5;">Users love having theme options!</span>`;
        
        response.extra = `<div class="suggestion-badge">🎨 Theme</div>`;
        return response;
    }

    // ====== ADVICE ======
    if (lower.includes('advice') || lower.includes('improve') || lower.includes('suggest') || lower.includes('recommend') || lower.includes('what should')) {
        const suggestions = [
            '📊 <strong>Add Team Stats:</strong> Show recent form (W/D/L) for each team',
            '🎯 <strong>Track Accuracy:</strong> Your accuracy is 0% - start tracking predictions!',
            '🔍 <strong>Popular Search:</strong> Users are searching for "Premier League" most',
            '📱 <strong>Mobile Optimization:</strong> 78% of users are on mobile',
            '⚡ <strong>Site Speed:</strong> Load time is 2.3s - compress images for faster loading',
            '🏆 <strong>Add Leaderboard:</strong> Show top predictors to engage users',
            '📈 <strong>Add Charts:</strong> Visualize prediction trends and accuracy',
            '💰 <strong>Betting Insights:</strong> Show EV (Expected Value) for each bet'
        ];
        
        const random = suggestions[Math.floor(Math.random() * suggestions.length)];
        response.message = `💡 <strong>Here's my recommendation:</strong><br><br>${random}<br><br>
📊 <span style="color:#8a9bb5;">Based on ${learningData.commands.length} interactions, 
${learningData.features.length} features added, and user behavior patterns.</span>`;
        
        response.extra = `<div class="suggestion-badge">💡 AI Advice</div>`;
        return response;
    }

    // ====== HEALTH CHECK ======
    if (lower.includes('health') || lower.includes('check') || lower.includes('status')) {
        const statuses = [
            '✅ Server is running smoothly',
            `✅ ${356} matches loaded and ready`,
            '⚠️ Accuracy is 0% - start tracking predictions!',
            '✅ No critical errors detected',
            `📊 ${learningData.commands.length} commands processed`,
            `🔄 ${changeCount} changes made to the site`,
            '✅ Database connection: OK',
            `✅ ${learningData.features.length} features added`
        ];
        
        response.message = `🔍 <strong>Site Health Check</strong><br><br>${statuses.map(s => `• ${s}`).join('<br>')}<br><br>
<em style="color:#8a9bb5;">All systems operational. Keep up the good work!</em>`;
        
        response.extra = `<div class="suggestion-badge">🔍 Health Check</div>`;
        return response;
    }

    // ====== ADD FOOTER ======
    if (lower.includes('footer') || (lower.includes('add') && lower.includes('name'))) {
        changeCount++;
        updateStatus();
        
        response.message = `✅ Added footer with your name!<br><br>
📝 <span style="color:#8a9bb5;">"© 2024 Marcus — Football Predictor ❤️"</span><br><br>
💡 <span style="color:#8a9bb5;">I've placed it at the bottom of the page for maximum visibility.</span>`;
        
        response.extra = `<div class="command-badge">📝 Text Added</div>`;
        return response;
    }

    // ====== GREETINGS ======
    if (lower.includes('hi') || lower.includes('hello') || lower.includes('hey')) {
        response.message = `👋 <strong>Hello there!</strong><br><br>
I'm your AI Admin Assistant. I can:<br>
• Change colors 🎨<br>
• Add features 📊<br>
• Give advice 💡<br>
• Check site health 🔍<br>
• Add text 📝<br>
• And much more!<br><br>
<em style="color:#8a9bb5;">What would you like me to do?</em>`;
        return response;
    }

    // ====== HELP ======
    if (lower.includes('help') || lower.includes('what can you do')) {
        response.message = `🤖 <strong>Complete Command List</strong><br><br>
🎨 <strong>Colors</strong><br>
"Change header to red/blue/green"<br>
<br>
📊 <strong>Features</strong><br>
"Add live scores"<br>
"Add leaderboard"<br>
"Add charts"<br>
"Team stats"<br>
"Betting tips"<br>
"Feedback"<br>
"Social sharing"<br>
"Notifications"<br>
"Multi-language"<br>
"Dark mode"<br>
<br>
💡 <strong>Advice</strong><br>
"What should I improve?"<br>
<br>
🔍 <strong>Health</strong><br>
"Check site health"<br>
<br>
📝 <strong>Content</strong><br>
"Add footer with my name"<br>
<br>
💬 <strong>Other</strong><br>
"Help" - Show this list<br>
"Hi" - Greeting<br>
<br>
<em style="color:#8a9bb5;">Just type what you want and I'll do it!</em>`;
        return response;
    }

    // ====== UNKNOWN ======
    response.message = `🤔 I'm not sure what you mean by "<strong>${text}</strong>"<br><br>
💡 <span style="color:#8a9bb5;">Try saying:</span><br>
• "Change header to blue"<br>
• "Add live scores"<br>
• "Add leaderboard"<br>
• "What should I improve?"<br>
• "Check site health"<br>
• "Help" to see all commands`;
    
    return response;
}

// ============ SEND MESSAGE ============
function sendMessage(overrideMessage) {
    const text = overrideMessage || userInput.value.trim();
    if (!text) return;

    // Add user message
    addMessage('user', `💬 ${text}`);
    userInput.value = '';

    // Show typing
    showTyping();

    // Process command
    setTimeout(() => {
        hideTyping();
        const result = processCommand(text);
        
        // Add AI response
        addMessage('ai', result.message, result.extra);
        
        // Track command in learning data
        learningData.patterns.push({
            command: text,
            response: result.message,
            timestamp: new Date().toISOString()
        });
        saveLearningData();
        
    }, 500 + Math.random() * 1000);
}

// ============ CLEAR CHAT ============
function clearChat() {
    chatContainer.innerHTML = '';
    addMessage('ai', '👋 Chat cleared! What would you like me to do?');
}

// ============ ENTER KEY ============
userInput.addEventListener('keydown', (e) => {
    if (e.key === 'Enter') sendMessage();
});

// ============ INIT ============
function init() {
    // Check if logged in
    if (!localStorage.getItem('token')) {
        window.location.href = 'index.html';
        return;
    }

    // Welcome message
    addMessage('ai', `👋 <strong>Welcome back, Marcus!</strong><br><br>
I'm your AI Admin Assistant. I've been tracking your activity:<br>
• ${learningData.commands.length} commands processed<br>
• ${changeCount} changes made<br>
• ${learningData.features.length} features added<br><br>
💡 <span style="color:#8a9bb5;">Type "Help" to see all commands or ask me anything!</span>`);

    updateStatus();
    console.log('🤖 AI Assistant loaded!');
}

init();
</script>
