<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>👑 Admin Dashboard</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #0a0e17;
            color: #f0f4fa;
            padding: 12px;
            padding-bottom: 90px;
            min-height: 100vh;
        }

        .app { max-width: 500px; margin: 0 auto; }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 14px 0;
            border-bottom: 1px solid #1a2a3a;
            margin-bottom: 16px;
        }

        .logo { display: flex; align-items: center; gap: 10px; }
        .logo-icon {
            width: 40px; height: 40px;
            background: linear-gradient(135deg, #ffa94d, #ff8c00);
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            font-weight: 900;
            color: #0a0e17;
        }
        .logo-text h1 {
            font-size: 17px;
            color: #ffa94d;
        }
        .logo-text small { font-size: 9px; color: #8a9bb5; }

        .header-actions { display: flex; gap: 8px; }
        .header-btn {
            width: 38px; height: 38px;
            border: 1px solid #1a2a3a;
            background: #111927;
            color: #f0f4fa;
            border-radius: 10px;
            font-size: 16px;
            cursor: pointer;
        }
        .header-btn:active { transform: scale(0.95); }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 6px;
            margin-bottom: 12px;
        }

        .stat-card {
            background: #111927;
            border: 1px solid #1a2a3a;
            border-radius: 10px;
            padding: 8px 6px;
            text-align: center;
        }
        .stat-card small { display: block; color: #8a9bb5; font-size: 8px; text-transform: uppercase; letter-spacing: 0.3px; }
        .stat-card strong { display: block; font-size: 14px; margin-top: 2px; }
        .stat-card .green { color: #00d4aa; }
        .stat-card .orange { color: #ffa94d; }
        .stat-card .red { color: #ff6b7a; }

        .tabs {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr 1fr;
            gap: 4px;
            margin-bottom: 12px;
        }

        .tab {
            padding: 10px 4px;
            background: #111927;
            border: 1px solid #1a2a3a;
            border-radius: 10px;
            color: #8a9bb5;
            font-size: 11px;
            font-weight: 600;
            cursor: pointer;
            text-align: center;
            transition: all 0.2s;
        }
        .tab.active {
            background: #ffa94d;
            color: #0a0e17;
            border-color: #ffa94d;
        }
        .tab:active { transform: scale(0.95); }

        .panel { display: none; animation: fadeIn 0.3s ease; }
        .panel.active { display: block; }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(6px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .card {
            background: #111927;
            border: 1px solid #1a2a3a;
            border-radius: 14px;
            padding: 14px;
            margin-bottom: 12px;
        }

        .card-title {
            font-size: 15px;
            font-weight: 700;
            margin-bottom: 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .tag {
            display: inline-block;
            padding: 2px 10px;
            background: rgba(255, 169, 77, 0.1);
            color: #ffa94d;
            border-radius: 100px;
            font-size: 9px;
            font-weight: 700;
        }

        .user-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 8px;
            border-bottom: 1px solid #1a2a3a;
        }
        .user-row .user-info { flex: 1; }
        .user-row .user-info strong { display: block; font-size: 14px; }
        .user-row .user-info small { color: #8a9bb5; font-size: 11px; }

        .btn {
            padding: 6px 12px;
            border: 1px solid #1a2a3a;
            background: #1a2438;
            color: #f0f4fa;
            border-radius: 8px;
            font-weight: 700;
            font-size: 11px;
            cursor: pointer;
            transition: all 0.2s;
        }
        .btn:active { transform: scale(0.95); }
        .btn-danger {
            border-color: #4a1a22;
            color: #ff6b7a;
            background: #1a0a0e;
        }
        .btn-primary {
            background: #ffa94d;
            color: #0a0e17;
            border-color: #ffa94d;
        }
        .btn-sm { padding: 4px 8px; font-size: 10px; }
        .btn-block { width: 100%; }

        .empty {
            text-align: center;
            padding: 20px 16px;
            color: #8a9bb5;
            border: 1px dashed #1a2a3a;
            border-radius: 12px;
            font-size: 13px;
        }

        .league-card {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 8px;
            border-bottom: 1px solid #1a2a3a;
        }
        .league-card .league-name { font-weight: 700; font-size: 14px; }
        .league-card .league-count { color: #00d4aa; font-weight: 700; }

        .toast {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: #111927;
            border: 1px solid #ffa94d;
            padding: 10px 18px;
            border-radius: 12px;
            font-size: 13px;
            font-weight: 600;
            box-shadow: 0 8px 32px rgba(0,0,0,0.6);
            z-index: 999;
            animation: slideUp 0.3s ease;
            max-width: 90%;
            text-align: center;
            color: #f0f4fa;
        }
        .toast.error { border-color: #ff6b7a; }
        .toast.success { border-color: #00d4aa; }

        @keyframes slideUp {
            from { opacity: 0; transform: translateX(-50%) translateY(20px); }
            to { opacity: 1; transform: translateX(-50%) translateY(0); }
        }

        .hidden { display: none !important; }
        .mt-2 { margin-top: 10px; }
        .text-muted { color: #8a9bb5; }
        .text-center { text-align: center; }
        .flex-between { display: flex; justify-content: space-between; align-items: center; }
        .gap-2 { gap: 8px; }

        .loading {
            display: inline-block;
            width: 14px;
            height: 14px;
            border: 2px solid #1a2a3a;
            border-top-color: #ffa94d;
            border-radius: 50%;
            animation: spin 0.6s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }

        .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }

        @media (max-width: 400px) {
            .stats-grid { grid-template-columns: 1fr 1fr 1fr; }
            .tabs { grid-template-columns: 1fr 1fr; }
            .grid-2 { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>

<div class="app">
    <header class="header">
        <div class="logo">
            <div class="logo-icon">👑</div>
            <div class="logo-text">
                <h1>Admin Panel</h1>
                <small>Control Center</small>
            </div>
        </div>
        <div class="header-actions">
            <button class="header-btn" onclick="window.location.href='dashboard.html'">📊</button>
            <button class="header-btn" id="logoutBtn">🚪</button>
        </div>
    </header>

    <div class="stats-grid">
        <div class="stat-card">
            <small>Total Users</small>
            <strong id="totalUsers" class="green">0</strong>
        </div>
        <div class="stat-card">
            <small>Total Predictions</small>
            <strong id="totalPredictions" class="orange">0</strong>
        </div>
        <div class="stat-card">
            <small>Accuracy</small>
            <strong id="systemAccuracy" class="green">0%</strong>
        </div>
    </div>

    <div class="tabs">
        <button class="tab active" data-tab="users">👥 Users</button>
        <button class="tab" data-tab="leagues">🏆 Leagues</button>
        <button class="tab" data-tab="settings">⚙️ Settings</button>
        <button class="tab" data-tab="stats">📊 Stats</button>
    </div>

    <section id="panel-users" class="panel active">
        <div class="card">
            <div class="card-title">
                <span>👥 All Users</span>
                <span class="tag" id="userCount">0</span>
            </div>
            <div id="userList">
                <div class="empty"><span class="loading"></span> Loading users...</div>
            </div>
        </div>
    </section>

    <section id="panel-leagues" class="panel">
        <div class="card">
            <div class="card-title">
                <span>🏆 Leagues</span>
                <span class="tag" id="leagueCount">0</span>
            </div>
            <div id="leagueList">
                <div class="empty"><span class="loading"></span> Loading leagues...</div>
            </div>
        </div>
    </section>

    <section id="panel-settings" class="panel">
        <div class="card">
            <div class="card-title">⚙️ Admin Settings</div>
            
            <label style="display:block;font-size:11px;color:#8a9bb5;font-weight:600;margin-bottom:8px;">
                API Key
                <input id="adminApiKey" type="text" style="width:100%;margin-top:4px;padding:10px 12px;background:#0a0e17;border:1px solid #1a2a3a;border-radius:10px;color:#f0f4fa;font-size:14px;outline:none;">
            </label>

            <div class="grid-2">
                <button class="btn btn-primary" id="saveSettingsBtn">💾 Save Settings</button>
                <button class="btn btn-danger" id="clearAllBtn">🗑️ Clear All Data</button>
            </div>
        </div>
    </section>

    <section id="panel-stats" class="panel">
        <div class="card">
            <div class="card-title">📊 System Stats</div>
            <div id="systemStats">
                <div class="empty"><span class="loading"></span> Loading stats...</div>
            </div>
        </div>
    </section>
</div>

<script>
const API_URL = window.location.hostname === 'localhost' 
    ? 'http://localhost:3000/api' 
    : 'https://football-predictor-e3s4.onrender.com/api';

const $ = id => document.getElementById(id);
const $$ = sel => document.querySelectorAll(sel);

function toast(msg, type = 'success') {
    const old = document.querySelector('.toast');
    if (old) old.remove();
    const div = document.createElement('div');
    div.className = `toast ${type}`;
    div.textContent = msg;
    document.body.appendChild(div);
    setTimeout(() => div.remove(), 3000);
}

function getToken() {
    return localStorage.getItem('token');
}

function logout() {
    localStorage.removeItem('token');
    localStorage.removeItem('user');
    window.location.href = 'index.html';
}

async function apiCall(endpoint, options = {}) {
    const token = getToken();
    const response = await fetch(`${API_URL}${endpoint}`, {
        ...options,
        headers: {
            'Content-Type': 'application/json',
            ...(token && { 'Authorization': `Bearer ${token}` }),
            ...(options.headers || {})
        }
    });

    const data = await response.json();
    if (!response.ok) {
        throw new Error(data.error || 'API error');
    }
    return data;
}

$$('.tab').forEach(tab => {
    tab.addEventListener('click', function() {
        $$('.tab').forEach(t => t.classList.remove('active'));
        $$('.panel').forEach(p => p.classList.remove('active'));
        this.classList.add('active');
        $(`panel-${this.dataset.tab}`).classList.add('active');
        
        if (this.dataset.tab === 'users') loadUsers();
        if (this.dataset.tab === 'leagues') loadLeagues();
        if (this.dataset.tab === 'stats') loadStats();
    });
});

async function loadUsers() {
    const list = $('userList');
    try {
        const users = await apiCall('/admin/users', { method: 'GET' });
        
        $('userCount').textContent = users.length;
        $('totalUsers').textContent = users.length;

        if (!users.length) {
            list.innerHTML = '<div class="empty">No users found</div>';
            return;
        }

        list.innerHTML = users.filter(u => !u.isOwner).map(u => `
            <div class="user-row">
                <div class="user-info">
                    <strong>${u.username}</strong>
                    <small>${u.email || 'No email'} • ${u.stats?.totalPredictions || 0} predictions</small>
                </div>
                <div style="display:flex;gap:4px;">
                    <button class="btn btn-danger btn-sm" onclick="deleteUser('${u.id}')">Delete</button>
                </div>
            </div>
        `).join('');

    } catch (err) {
        list.innerHTML = `<div class="empty">❌ ${err.message}</div>`;
    }
}

window.deleteUser = async function(userId) {
    if (!confirm('Delete this user?')) return;
    try {
        await apiCall(`/admin/users/${userId}`, { method: 'DELETE' });
        toast('✅ User deleted', 'success');
        loadUsers();
    } catch (err) {
        toast(err.message, 'error');
    }
};

async function loadLeagues() {
    const list = $('leagueList');
    try {
        const predictions = await apiCall('/admin/predictions', { method: 'GET' });
        
        const leagues = {};
        predictions.forEach(p => {
            const league = p.league || 'Unknown';
            if (!leagues[league]) leagues[league] = 0;
            leagues[league]++;
        });

        const leagueArray = Object.entries(leagues).sort((a, b) => b[1] - a[1]);
        $('leagueCount').textContent = leagueArray.length;

        if (!leagueArray.length) {
            list.innerHTML = '<div class="empty">No leagues found</div>';
            return;
        }

        list.innerHTML = leagueArray.map(([league, count]) => `
            <div class="league-card">
                <span class="league-name">${league}</span>
                <span class="league-count">${count} matches</span>
            </div>
        `).join('');

    } catch (err) {
        list.innerHTML = `<div class="empty">❌ ${err.message}</div>`;
    }
}

async function loadStats() {
    const container = $('systemStats');
    try {
        const stats = await apiCall('/admin/stats', { method: 'GET' });
        
        $('totalPredictions').textContent = stats.totalPredictions || 0;
        $('systemAccuracy').textContent = (stats.accuracy || 0) + '%';

        container.innerHTML = `
            <div class="grid-2">
                <div class="stat-card">
                    <small>Total Users</small>
                    <strong class="green">${stats.totalUsers || 0}</strong>
                </div>
                <div class="stat-card">
                    <small>Total Predictions</small>
                    <strong class="orange">${stats.totalPredictions || 0}</strong>
                </div>
                <div class="stat-card">
                    <small>Correct Predictions</small>
                    <strong class="green">${stats.correctPredictions || 0}</strong>
                </div>
                <div class="stat-card">
                    <small>System Accuracy</small>
                    <strong class="green">${stats.accuracy || 0}%</strong>
                </div>
            </div>
        `;

    } catch (err) {
        container.innerHTML = `<div class="empty">❌ ${err.message}</div>`;
    }
}

$('saveSettingsBtn').addEventListener('click', function() {
    toast('✅ Settings saved!', 'success');
});

$('clearAllBtn').addEventListener('click', function() {
    if (!confirm('Delete ALL data? This cannot be undone!')) return;
    toast('🗑️ All data cleared', 'success');
});

$('logoutBtn').addEventListener('click', logout);

function init() {
    const user = JSON.parse(localStorage.getItem('user') || '{}');
    if (!user.isOwner) {
        toast('⚠️ Admin access only', 'error');
        window.location.href = 'dashboard.html';
        return;
    }

    loadUsers();
    loadStats();
    toast('👑 Welcome Admin!', 'success');
}

init();
</script>
</body>
</html>
